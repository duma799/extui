[project]
name = "extui"
version = "0.1.0"
description = "Terminal dashboard and CLI for Minecraft servers hosted on exaroton"
readme = "README.md"
authors = [{ name = "duma799" }]
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["minecraft", "exaroton", "tui", "terminal", "server-admin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "platformdirs>=4.11.10",
    "textual>=8.2.8",
    "websockets>=17.1",
]

[project.scripts]
extui = "extui.cli:main"

[project.urls]
Homepage = "https://github.com/duma799/extui"
Issues = "https://github.com/duma799/extui/issues"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:extui.*"]
